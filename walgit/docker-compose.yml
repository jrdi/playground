services:
  minio:
    # Conditional writes (If-Match / If-None-Match on PUT) are the backbone of the
    # WAL. They only exist in reasonably recent MinIO builds -- do not downgrade
    # this image without running `make preflight`.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: walgit
      MINIO_ROOT_PASSWORD: walgitwalgit
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data

volumes:
  minio-data:
