[project]
name = "walgit"
version = "0.1.0"
description = "Git at any scale: a WAL + CAS git server on S3, as a fill-in-the-blanks exercise"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.36.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["walgit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
markers = [
    "slow: exercises that shell out to real git a lot",
]
addopts = "-ra --tb=short"
